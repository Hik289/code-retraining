defaults:
  rounds: 5
  seeds: [0]
  accepted_samples: 5000
  raw_samples: 20000
  retained_fraction: 0.25
  candidate_batch: 2000
  max_candidates: 200000
  prompt_tokens: 1024
  max_new_tokens: 1024
  generation_batch_size: 8
  score_batch_size: 8
  temperature: 0.8
  top_p: 0.95
  repetition_threshold: 0.3
  min_completion_tokens: 50
  prompt_seed: 0
  training:
    max_steps: 3000
    seq_length: 2048
    learning_rate: 0.00005
    weight_decay: 0.05
    warmup_steps: 500
    fim_rate: 0.0
  evaluation:
    datasets: [humaneval, mbpp, livecodebench]
    n_samples: 200
    temperature: 0.8
    top_p: 0.95
    max_new_tokens: 512
    release_version: release_v1
    workers: 16
  execution:
    samples: 500
    timeout: 5
    workers: 4
    image: python:3.11-slim
models:
  santacoder:
    config: configs/santacoder.yaml
    nl_fraction: 0.0
    batch_size: 32
    gradient_accumulation_steps: 2
  starcoder2:
    config: configs/starcoder2.yaml
    nl_fraction: 0.25
    batch_size: 8
    gradient_accumulation_steps: 8
  qwen25:
    config: configs/qwen25.yaml
    nl_fraction: 0.25
    batch_size: 16
    gradient_accumulation_steps: 4
  codellama:
    config: configs/codellama.yaml
    nl_fraction: 0.0
    batch_size: 8
    gradient_accumulation_steps: 8
suites:
  main:
    models: [santacoder, starcoder2, qwen25, codellama]
    gates: [none, compile, quality, ppl, binary]
  execution_review:
    models: [qwen25]
    gates: [none, compile, binary, execution]
  anchor:
    models: [qwen25]
    nl_fraction: 0.0
    cases:
      - {name: synthetic_only, gate: none, anchor_fraction: 0.0}
      - {name: execution_only, gate: execution, anchor_fraction: 0.0}
      - {name: execution_anchor_5pct, gate: execution, anchor_fraction: 0.05}
  noisy_gate:
    models: [qwen25]
    cases:
      - {name: compile_noise_0, gate: compile, noise: 0.0}
      - {name: compile_noise_5pct, gate: compile, noise: 0.05}
      - {name: compile_noise_10pct, gate: compile, noise: 0.10}
      - {name: compile_noise_20pct, gate: compile, noise: 0.20}
  single_seed:
    models: [santacoder, qwen25]
    gates: [none, compile, binary]
  extended:
    models: [santacoder]
    cases:
      - {name: none_10r, gate: none, rounds: 10}
      - {name: compile_10r, gate: compile, rounds: 10}
      - {name: compile_quality_10r, gate: compile+quality, rounds: 10}
      - {name: ppl_10r, gate: ppl, rounds: 10}
      - {name: binary_10r, gate: binary, rounds: 10}
      - name: quality_20r
        gate: quality
        rounds: 20
        evaluation_rounds: [0, 1, 2, 3, 4, 5, 10, 15, 20]
